<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Art Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Status Bar */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }

        #status-bar .room-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        #status-bar .artwork-count {
            color: #4ade80;
            font-size: 13px;
        }

        /* Controls Help */
        #controls-help {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }

        #controls-help div {
            margin: 4px 0;
            color: #ccc;
        }

        #controls-help kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        /* Mini Map */
        #mini-map {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
        }

        #mini-map canvas {
            width: 100%;
            border-radius: 4px;
        }

        #mini-map .room-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        #mini-map button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #374151;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #mini-map button:hover {
            background: #4b5563;
        }

        #mini-map button.active {
            background: #3b82f6;
        }

        /* Artwork Viewer Modal */
        #artwork-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #artwork-viewer.active {
            display: flex;
        }

        #artwork-viewer .viewer-content {
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #artwork-viewer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 4px;
        }

        #artwork-viewer .artwork-info {
            margin-top: 20px;
            text-align: center;
            color: white;
        }

        #artwork-viewer .artwork-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        #artwork-viewer .artwork-artist {
            font-size: 18px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        #artwork-viewer .artwork-price {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 16px;
        }

        #artwork-viewer .artwork-link {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }

        #artwork-viewer .artwork-link:hover {
            background: #2563eb;
        }

        #artwork-viewer .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #artwork-viewer .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Door Prompt */
        #door-prompt {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 100;
            text-align: center;
        }

        #door-prompt.active {
            display: block;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #loading-screen h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
        }

        #loading-screen .progress {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        #loading-screen .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s;
        }

        #loading-screen .status {
            color: #9ca3af;
            margin-top: 16px;
            font-size: 14px;
        }

        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 50;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }

        /* Fade overlay for room transitions */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            transition: opacity 0.4s;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1>Virtual Gallery</h1>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <div class="status">Loading...</div>
    </div>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="status-bar">
        <div class="room-name">Main Gallery</div>
        <div class="artwork-count">Loading artworks...</div>
    </div>

    <div id="controls-help">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
        <div><kbd>Mouse</kbd> Look around</div>
        <div><kbd>Click</kbd> View artwork</div>
        <div><kbd>E</kbd> Enter door</div>
    </div>

    <div id="mini-map">
        <canvas id="map-canvas" width="156" height="120"></canvas>
        <div class="room-buttons">
            <button id="btn-main" class="active">Main Gallery</button>
            <button id="btn-contemporary">Contemporary</button>
        </div>
    </div>

    <div id="door-prompt">
        Press <kbd>E</kbd> to enter <span class="door-label"></span>
    </div>

    <div id="fade-overlay"></div>

    <div id="artwork-viewer">
        <button class="close-btn">&times;</button>
        <div class="viewer-content">
            <img src="" alt="">
            <div class="artwork-info">
                <div class="artwork-title"></div>
                <div class="artwork-artist"></div>
                <div class="artwork-price"></div>
                <a class="artwork-link" href="#" target="_blank">View in Shop</a>
            </div>
        </div>
    </div>

<script>
// ============================================================
// CONFIGURATION - Single source of truth for gallery layout
// ============================================================

const CONFIG = {
    // Room definitions with unified spots (walls + floors in one array)
    rooms: {
        'main-gallery': {
            name: 'Main Gallery',
            dimensions: { width: 16, depth: 20, height: 5 },
            position: { x: 0, y: 0, z: 0 },
            theme: { wallColor: 0xf5f5f5, floorColor: 0xfafafa },
            spots: [
                // Back wall spots
                { id: 'main-gallery:back-1', type: 'wall', position: { x: -4, y: 2.2, z: -9.9 }, rotation: 0, name: 'Back Left Wall' },
                { id: 'main-gallery:back-2', type: 'wall', position: { x: 0, y: 2.2, z: -9.9 }, rotation: 0, name: 'Back Center Wall' },
                { id: 'main-gallery:back-3', type: 'wall', position: { x: 4, y: 2.2, z: -9.9 }, rotation: 0, name: 'Back Right Wall' },
                // Right wall spots
                { id: 'main-gallery:right-1', type: 'wall', position: { x: 7.9, y: 2.2, z: -4 }, rotation: -Math.PI / 2, name: 'Right Front Wall' },
                { id: 'main-gallery:right-2', type: 'wall', position: { x: 7.9, y: 2.2, z: 4 }, rotation: -Math.PI / 2, name: 'Right Back Wall' },
                // Left wall spots
                { id: 'main-gallery:left-1', type: 'wall', position: { x: -7.9, y: 2.2, z: -4 }, rotation: Math.PI / 2, name: 'Left Front Wall' },
                { id: 'main-gallery:left-2', type: 'wall', position: { x: -7.9, y: 2.2, z: 4 }, rotation: Math.PI / 2, name: 'Left Back Wall' },
                // Floor spots (easel placements)
                { id: 'main-gallery:floor-1', type: 'floor', position: { x: -3, y: 0, z: 6 }, rotation: 0, name: 'Front Left' },
                { id: 'main-gallery:floor-2', type: 'floor', position: { x: 0, y: 0, z: 6 }, rotation: 0, name: 'Front Center' },
                { id: 'main-gallery:floor-3', type: 'floor', position: { x: 3, y: 0, z: 6 }, rotation: 0, name: 'Front Right' },
                { id: 'main-gallery:floor-5', type: 'floor', position: { x: 3, y: 0, z: -6 }, rotation: 0, name: 'Rear Right' },
                { id: 'main-gallery:floor-center', type: 'floor', position: { x: 0, y: 0, z: 0 }, rotation: 0, name: 'Center Stage' }
            ],
            doors: [
                { position: { x: 6, y: 0, z: 10 }, rotation: Math.PI, targetRoom: 'contemporary-wing', label: 'Contemporary Wing' }
            ]
        },
        'contemporary-wing': {
            name: 'Contemporary Wing',
            dimensions: { width: 20, depth: 16, height: 5 },
            position: { x: 0, y: 0, z: 28 },
            theme: { wallColor: 0xf0f4ff, floorColor: 0xffffff },
            spots: [
                // North wall (back)
                { id: 'contemporary-wing:north-1', type: 'wall', position: { x: -5, y: 2.2, z: -7.9 }, rotation: 0, name: 'Skyline Panel' },
                { id: 'contemporary-wing:north-2', type: 'wall', position: { x: 0, y: 2.2, z: -7.9 }, rotation: 0, name: 'Lightwell' },
                { id: 'contemporary-wing:north-3', type: 'wall', position: { x: 5, y: 2.2, z: -7.9 }, rotation: 0, name: 'Glass Passage' },
                // West wall (left)
                { id: 'contemporary-wing:west-1', type: 'wall', position: { x: -9.9, y: 2.2, z: -3 }, rotation: Math.PI / 2, name: 'Chromatic Stack' },
                { id: 'contemporary-wing:west-2', type: 'wall', position: { x: -9.9, y: 2.2, z: 3 }, rotation: Math.PI / 2, name: 'Cascade Wall' },
                // East wall (right)
                { id: 'contemporary-wing:east-1', type: 'wall', position: { x: 9.9, y: 2.2, z: -3 }, rotation: -Math.PI / 2, name: 'Spectrum Drift' },
                { id: 'contemporary-wing:east-2', type: 'wall', position: { x: 9.9, y: 2.2, z: 3 }, rotation: -Math.PI / 2, name: 'Neon Strata' },
                // Floor spots
                { id: 'contemporary-wing:floor-1', type: 'floor', position: { x: -4, y: 0, z: -4 }, rotation: 0, name: 'Atrium Plinth' },
                { id: 'contemporary-wing:floor-2', type: 'floor', position: { x: 0, y: 0, z: -4 }, rotation: 0, name: 'Reflective Stage' },
                { id: 'contemporary-wing:floor-3', type: 'floor', position: { x: 4, y: 0, z: -4 }, rotation: 0, name: 'Aurora Base' },
                { id: 'contemporary-wing:floor-4', type: 'floor', position: { x: -4, y: 0, z: 4 }, rotation: 0, name: 'Sculpture Garden' },
                { id: 'contemporary-wing:floor-5', type: 'floor', position: { x: 4, y: 0, z: 4 }, rotation: 0, name: 'Light Pool' }
            ],
            doors: [
                { position: { x: 0, y: 0, z: 8 }, rotation: 0, targetRoom: 'main-gallery', label: 'Main Gallery' }
            ]
        }
    },

    camera: {
        fov: 75,
        near: 0.1,
        far: 1000,
        eyeLevel: 1.6,
        moveSpeed: 5,
        lookSpeed: 0.002
    },

    dataUrl: 'data.csv'
};

// ============================================================
// STATE - Simple, centralized state
// ============================================================

const state = {
    currentRoom: 'main-gallery',
    artworks: new Map(),        // artwork id -> artwork data
    placements: new Map(),      // spotId -> artwork data
    isPointerLocked: false,
    nearDoor: null,
    selectedArtwork: null
};

// ============================================================
// DATA LOADING - Simple CSV parser
// ============================================================

async function loadArtworksFromCSV() {
    updateLoadingStatus('Loading artwork data...');

    try {
        const response = await fetch(CONFIG.dataUrl);
        const text = await response.text();
        const artworks = parseCSV(text);

        console.log(`[Data] Loaded ${artworks.length} artwork events from CSV`);

        // Store artworks and create placements map
        artworks.forEach(artwork => {
            if (artwork.locationId && artwork.imageUrl) {
                state.artworks.set(artwork.id, artwork);
                state.placements.set(artwork.locationId, artwork);
                console.log(`[Data] Placed: "${artwork.title}" at ${artwork.locationId}`);
            }
        });

        console.log(`[Data] Total placements: ${state.placements.size}`);
        updateLoadingStatus(`Loaded ${state.placements.size} placed artworks`);
        return artworks;
    } catch (error) {
        console.error('[Data] Failed to load CSV:', error);
        updateLoadingStatus('Failed to load artworks');
        return [];
    }
}

function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];

    const artworks = [];

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;

        const parts = parseCSVLine(line);
        if (parts.length < 12) continue;

        const [id, created_at, event_uid, verb, op, frame, scale, published, actor_id, object_type, object_id, dataStr] = parts;

        // Only process artwork_upload events
        if (op !== 'artwork_upload') continue;

        try {
            const data = JSON.parse(dataStr);
            artworks.push({
                id: object_id,
                title: data.title || 'Untitled',
                artist: data.artist || 'Unknown Artist',
                description: data.description || '',
                imageUrl: data.imageUrl,
                productUrl: data.productUrl,
                price: data.price,
                currency: data.currency || 'USD',
                roomId: data.roomId,
                locationId: data.locationId,
                locationName: data.locationName,
                heightMeters: data.heightMeters || 0.9144,
                widthInches: data.widthInches,
                heightInches: data.heightInches
            });
        } catch (e) {
            console.warn('[Data] Failed to parse row:', i, e.message);
        }
    }

    return artworks;
}

function parseCSVLine(line) {
    const parts = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"' && (i === 0 || line[i-1] !== '\\')) {
            inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
            parts.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    parts.push(current.trim());

    return parts.map(p => {
        if (p.startsWith('"') && p.endsWith('"')) {
            return p.slice(1, -1).replace(/""/g, '"');
        }
        return p;
    });
}

// ============================================================
// THREE.JS SCENE
// ============================================================

let scene, camera, renderer;
let roomMeshes = new Map();
let spotMeshes = new Map();      // spotId -> spot mesh
let artworkMeshes = new Map();   // spotId -> artwork group
let doorMeshes = [];
let clock;

function initScene() {
    updateLoadingStatus('Initializing 3D scene...');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    camera = new THREE.PerspectiveCamera(
        CONFIG.camera.fov,
        window.innerWidth / window.innerHeight,
        CONFIG.camera.near,
        CONFIG.camera.far
    );

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Global lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    clock = new THREE.Clock();

    // Build all rooms
    Object.keys(CONFIG.rooms).forEach(roomId => {
        buildRoom(roomId);
    });

    // Position camera in starting room
    const startRoom = CONFIG.rooms[state.currentRoom];
    camera.position.set(
        startRoom.position.x,
        CONFIG.camera.eyeLevel,
        startRoom.position.z + startRoom.dimensions.depth / 2 - 3
    );

    updateRoomVisibility();
    window.addEventListener('resize', onWindowResize);
}

function buildRoom(roomId) {
    const roomConfig = CONFIG.rooms[roomId];
    const roomGroup = new THREE.Group();
    roomGroup.name = roomId;

    const { width, depth, height } = roomConfig.dimensions;
    const { x, y, z } = roomConfig.position;

    // Floor
    const floorGeom = new THREE.PlaneGeometry(width, depth);
    const floorMat = new THREE.MeshStandardMaterial({ color: roomConfig.theme.floorColor, roughness: 0.4 });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    roomGroup.add(floor);

    // Ceiling
    const ceilingGeom = new THREE.PlaneGeometry(width, depth);
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const ceiling = new THREE.Mesh(ceilingGeom, ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = height;
    roomGroup.add(ceiling);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: roomConfig.theme.wallColor, roughness: 0.9 });

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
    backWall.position.set(0, height / 2, -depth / 2);
    roomGroup.add(backWall);

    const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
    frontWall.position.set(0, height / 2, depth / 2);
    frontWall.rotation.y = Math.PI;
    roomGroup.add(frontWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(depth, height), wallMat);
    leftWall.position.set(-width / 2, height / 2, 0);
    leftWall.rotation.y = Math.PI / 2;
    roomGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(depth, height), wallMat);
    rightWall.position.set(width / 2, height / 2, 0);
    rightWall.rotation.y = -Math.PI / 2;
    roomGroup.add(rightWall);

    // Create invisible spot markers
    roomConfig.spots.forEach(spot => {
        const spotMesh = createSpotMarker(spot);
        spotMesh.userData = { ...spot, roomId };
        roomGroup.add(spotMesh);
        spotMeshes.set(spot.id, spotMesh);
    });

    // Create doors
    roomConfig.doors.forEach(doorConfig => {
        const door = createDoor(doorConfig, roomId);
        roomGroup.add(door);
        doorMeshes.push(door);
    });

    // Room lighting
    addRoomLighting(roomGroup, roomConfig);

    roomGroup.position.set(x, y, z);
    scene.add(roomGroup);
    roomMeshes.set(roomId, roomGroup);
}

function createSpotMarker(spot) {
    const geometry = spot.type === 'floor'
        ? new THREE.CylinderGeometry(0.5, 0.5, 0.02, 16)
        : new THREE.BoxGeometry(1.5, 1.5, 0.02);

    const material = new THREE.MeshBasicMaterial({ visible: false });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(spot.position.x, spot.position.y, spot.position.z);
    if (spot.type === 'wall') mesh.rotation.y = spot.rotation;
    return mesh;
}

function createDoor(doorConfig, roomId) {
    const doorGroup = new THREE.Group();

    // Frame
    const frameGeom = new THREE.BoxGeometry(1.8, 2.8, 0.15);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a });
    const frame = new THREE.Mesh(frameGeom, frameMat);
    frame.position.y = 1.4;
    doorGroup.add(frame);

    // Opening
    const openingGeom = new THREE.PlaneGeometry(1.5, 2.5);
    const openingMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const opening = new THREE.Mesh(openingGeom, openingMat);
    opening.position.y = 1.25;
    opening.position.z = 0.08;
    doorGroup.add(opening);

    // Arrow
    const arrowGeom = new THREE.ConeGeometry(0.15, 0.3, 8);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });
    const arrow = new THREE.Mesh(arrowGeom, arrowMat);
    arrow.rotation.x = Math.PI / 2;
    arrow.position.set(0, 1.5, 0.2);
    doorGroup.add(arrow);

    doorGroup.position.set(doorConfig.position.x, doorConfig.position.y, doorConfig.position.z);
    doorGroup.rotation.y = doorConfig.rotation;
    doorGroup.userData = { isDoor: true, targetRoom: doorConfig.targetRoom, label: doorConfig.label, sourceRoom: roomId };

    return doorGroup;
}

function addRoomLighting(roomGroup, roomConfig) {
    roomConfig.spots.filter(s => s.type === 'wall').forEach(spot => {
        const light = new THREE.SpotLight(0xffffff, 0.8);
        light.position.set(spot.position.x, roomConfig.dimensions.height - 0.5, spot.position.z + 2);
        light.target.position.set(spot.position.x, spot.position.y, spot.position.z);
        light.angle = 0.5;
        light.penumbra = 0.5;
        light.castShadow = true;
        roomGroup.add(light);
        roomGroup.add(light.target);
    });
}

function updateRoomVisibility() {
    roomMeshes.forEach((mesh, roomId) => {
        mesh.visible = (roomId === state.currentRoom);
    });

    // Also show/hide artworks based on room
    artworkMeshes.forEach((mesh, spotId) => {
        const roomId = spotId.split(':')[0];
        mesh.visible = (roomId === state.currentRoom);
    });

    // Update UI
    const roomConfig = CONFIG.rooms[state.currentRoom];
    document.querySelector('#status-bar .room-name').textContent = roomConfig.name;

    let count = 0;
    roomConfig.spots.forEach(spot => {
        if (state.placements.has(spot.id)) count++;
    });
    document.querySelector('#status-bar .artwork-count').textContent = `${count} artwork${count !== 1 ? 's' : ''} displayed`;

    // Update mini-map buttons
    document.querySelectorAll('#mini-map button').forEach(btn => btn.classList.remove('active'));
    const activeBtn = state.currentRoom === 'main-gallery' ? '#btn-main' : '#btn-contemporary';
    document.querySelector(activeBtn).classList.add('active');
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============================================================
// ARTWORK RENDERING
// ============================================================

const textureLoader = new THREE.TextureLoader();

function renderAllArtworks() {
    updateLoadingStatus('Rendering artworks...');

    let loaded = 0;
    const total = state.placements.size;

    if (total === 0) {
        updateLoadingProgress(100);
        return;
    }

    state.placements.forEach((artwork, spotId) => {
        const spotMesh = spotMeshes.get(spotId);
        if (!spotMesh) {
            console.warn(`[Render] Spot not found: ${spotId}`);
            loaded++;
            updateLoadingProgress((loaded / total) * 100);
            return;
        }

        renderArtwork(artwork, spotMesh.userData, () => {
            loaded++;
            updateLoadingProgress((loaded / total) * 100);
        });
    });
}

function renderArtwork(artwork, spot, onComplete) {
    textureLoader.load(
        artwork.imageUrl,
        (texture) => {
            const aspectRatio = texture.image.width / texture.image.height;
            const height = artwork.heightMeters || 0.9;
            const width = height * aspectRatio;

            if (spot.type === 'wall') {
                createWallArtwork(artwork, spot, texture, width, height);
            } else {
                createFloorArtwork(artwork, spot, texture, width, height);
            }

            console.log(`[Render] Rendered "${artwork.title}" at ${spot.id} (${spot.type})`);
            if (onComplete) onComplete();
        },
        undefined,
        (error) => {
            console.error(`[Render] Failed to load: ${artwork.imageUrl}`, error);
            if (onComplete) onComplete();
        }
    );
}

function createWallArtwork(artwork, spot, texture, width, height) {
    const group = new THREE.Group();

    // Frame
    const frameDepth = 0.05;
    const frameBorder = 0.08;
    const frameGeom = new THREE.BoxGeometry(width + frameBorder * 2, height + frameBorder * 2, frameDepth);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d, roughness: 0.3 });
    const frame = new THREE.Mesh(frameGeom, frameMat);
    frame.castShadow = true;
    group.add(frame);

    // Canvas
    const canvasGeom = new THREE.PlaneGeometry(width, height);
    const canvasMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
    const canvas = new THREE.Mesh(canvasGeom, canvasMat);
    canvas.position.z = frameDepth / 2 + 0.001;
    group.add(canvas);

    // Position
    const roomPos = CONFIG.rooms[spot.roomId].position;
    group.position.set(roomPos.x + spot.position.x, roomPos.y + spot.position.y, roomPos.z + spot.position.z);
    group.rotation.y = spot.rotation;

    // Offset from wall
    const offset = new THREE.Vector3(0, 0, 0.05);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), spot.rotation);
    group.position.add(offset);

    group.userData = { isArtwork: true, artwork, spotId: spot.id };

    // Placard
    const placard = createPlacard(artwork, width);
    placard.position.y = -height / 2 - 0.25;
    placard.position.z = 0.03;
    group.add(placard);

    scene.add(group);
    artworkMeshes.set(spot.id, group);
}

function createFloorArtwork(artwork, spot, texture, width, height) {
    const group = new THREE.Group();
    const easelMat = new THREE.MeshStandardMaterial({ color: 0x4a3728 });

    // Easel legs
    const legGeom = new THREE.CylinderGeometry(0.02, 0.02, 1.8, 8);

    const leg1 = new THREE.Mesh(legGeom, easelMat);
    leg1.position.set(-0.25, 0.9, -0.15);
    leg1.rotation.x = 0.1;
    group.add(leg1);

    const leg2 = new THREE.Mesh(legGeom, easelMat);
    leg2.position.set(0.25, 0.9, -0.15);
    leg2.rotation.x = 0.1;
    group.add(leg2);

    const leg3 = new THREE.Mesh(legGeom, easelMat);
    leg3.position.set(0, 0.9, 0.2);
    leg3.rotation.x = -0.15;
    group.add(leg3);

    // Support bar
    const barGeom = new THREE.BoxGeometry(0.6, 0.03, 0.03);
    const bar = new THREE.Mesh(barGeom, easelMat);
    bar.position.set(0, 0.5, -0.1);
    group.add(bar);

    // Scale artwork
    const maxSize = 0.7;
    const scale = Math.min(maxSize / width, maxSize / height);
    const scaledWidth = width * scale;
    const scaledHeight = height * scale;

    // Frame
    const frameGeom = new THREE.BoxGeometry(scaledWidth + 0.06, scaledHeight + 0.06, 0.03);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
    const frame = new THREE.Mesh(frameGeom, frameMat);
    frame.position.set(0, 1.1 + scaledHeight / 2, -0.1);
    frame.rotation.x = -0.1;
    frame.castShadow = true;
    group.add(frame);

    // Canvas
    const canvasGeom = new THREE.PlaneGeometry(scaledWidth, scaledHeight);
    const canvasMat = new THREE.MeshStandardMaterial({ map: texture });
    const canvas = new THREE.Mesh(canvasGeom, canvasMat);
    canvas.position.set(0, 1.1 + scaledHeight / 2, -0.08);
    canvas.rotation.x = -0.1;
    group.add(canvas);

    // Position
    const roomPos = CONFIG.rooms[spot.roomId].position;
    group.position.set(roomPos.x + spot.position.x, roomPos.y + spot.position.y, roomPos.z + spot.position.z);
    group.rotation.y = Math.PI;

    group.userData = { isArtwork: true, artwork, spotId: spot.id };

    scene.add(group);
    artworkMeshes.set(spot.id, group);
}

function createPlacard(artwork, artworkWidth) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512;
    canvas.height = 128;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#e5e5e5';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    const title = artwork.title.length > 30 ? artwork.title.substring(0, 30) + '...' : artwork.title;
    ctx.fillText(title, canvas.width / 2, 40);

    ctx.fillStyle = '#666666';
    ctx.font = '22px Arial';
    ctx.fillText(artwork.artist, canvas.width / 2, 75);

    if (artwork.price) {
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(`$${artwork.price} ${artwork.currency || 'USD'}`, canvas.width / 2, 110);
    }

    const texture = new THREE.CanvasTexture(canvas);
    const placardWidth = Math.min(artworkWidth, 0.5);
    const placardHeight = placardWidth * (canvas.height / canvas.width);

    const geometry = new THREE.PlaneGeometry(placardWidth, placardHeight);
    const material = new THREE.MeshBasicMaterial({ map: texture });

    return new THREE.Mesh(geometry, material);
}

// ============================================================
// CONTROLS
// ============================================================

const keys = { w: false, a: false, s: false, d: false };

function initControls() {
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) keys[key] = true;
        if (key === 'e' && state.nearDoor) transitionToRoom(state.nearDoor.targetRoom);
        if (key === 'escape') closeArtworkViewer();
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) keys[key] = false;
    });

    const canvas = renderer.domElement;

    canvas.addEventListener('click', () => {
        if (!state.isPointerLocked) {
            canvas.requestPointerLock();
        } else {
            checkArtworkClick();
        }
    });

    document.addEventListener('pointerlockchange', () => {
        state.isPointerLocked = document.pointerLockElement === canvas;
    });

    document.addEventListener('mousemove', (e) => {
        if (!state.isPointerLocked) return;
        camera.rotation.y -= e.movementX * CONFIG.camera.lookSpeed;
        camera.rotation.x -= e.movementY * CONFIG.camera.lookSpeed;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
    });

    document.getElementById('btn-main').addEventListener('click', () => {
        if (state.currentRoom !== 'main-gallery') transitionToRoom('main-gallery');
    });

    document.getElementById('btn-contemporary').addEventListener('click', () => {
        if (state.currentRoom !== 'contemporary-wing') transitionToRoom('contemporary-wing');
    });

    document.querySelector('#artwork-viewer .close-btn').addEventListener('click', closeArtworkViewer);
    document.getElementById('artwork-viewer').addEventListener('click', (e) => {
        if (e.target.id === 'artwork-viewer') closeArtworkViewer();
    });
}

function updateMovement(delta) {
    if (!state.isPointerLocked) return;

    const speed = CONFIG.camera.moveSpeed * delta;
    const direction = new THREE.Vector3();

    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0;
    forward.normalize();

    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();

    if (keys.w) direction.add(forward);
    if (keys.s) direction.sub(forward);
    if (keys.d) direction.add(right);
    if (keys.a) direction.sub(right);

    if (direction.length() > 0) {
        direction.normalize();
        const newPos = camera.position.clone().add(direction.multiplyScalar(speed));

        const room = CONFIG.rooms[state.currentRoom];
        const halfWidth = room.dimensions.width / 2 - 1;
        const halfDepth = room.dimensions.depth / 2 - 1;

        newPos.x = Math.max(room.position.x - halfWidth, Math.min(room.position.x + halfWidth, newPos.x));
        newPos.z = Math.max(room.position.z - halfDepth, Math.min(room.position.z + halfDepth, newPos.z));

        camera.position.copy(newPos);
    }
}

function checkDoorProximity() {
    const doorPrompt = document.getElementById('door-prompt');
    state.nearDoor = null;

    for (const door of doorMeshes) {
        if (door.userData.sourceRoom !== state.currentRoom) continue;

        const doorWorldPos = new THREE.Vector3();
        door.getWorldPosition(doorWorldPos);

        if (camera.position.distanceTo(doorWorldPos) < 2.5) {
            state.nearDoor = door.userData;
            doorPrompt.querySelector('.door-label').textContent = door.userData.label;
            doorPrompt.classList.add('active');
            return;
        }
    }

    doorPrompt.classList.remove('active');
}

function transitionToRoom(targetRoomId) {
    if (targetRoomId === state.currentRoom) return;

    const overlay = document.getElementById('fade-overlay');
    overlay.style.opacity = '1';

    setTimeout(() => {
        state.currentRoom = targetRoomId;

        const room = CONFIG.rooms[targetRoomId];
        camera.position.set(room.position.x, CONFIG.camera.eyeLevel, room.position.z);

        updateRoomVisibility();

        setTimeout(() => { overlay.style.opacity = '0'; }, 100);
    }, 400);
}

// ============================================================
// ARTWORK INTERACTION
// ============================================================

const raycaster = new THREE.Raycaster();

function checkArtworkClick() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

    const meshesToCheck = [];
    artworkMeshes.forEach(group => {
        if (group.visible && group.userData.artwork) {
            group.traverse(child => { if (child.isMesh) meshesToCheck.push(child); });
        }
    });

    const intersects = raycaster.intersectObjects(meshesToCheck, false);

    if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.artwork) obj = obj.parent;
        if (obj && obj.userData.artwork) openArtworkViewer(obj.userData.artwork);
    }
}

function openArtworkViewer(artwork) {
    state.selectedArtwork = artwork;

    const viewer = document.getElementById('artwork-viewer');
    viewer.querySelector('img').src = artwork.imageUrl;
    viewer.querySelector('.artwork-title').textContent = artwork.title;
    viewer.querySelector('.artwork-artist').textContent = artwork.artist;

    if (artwork.price) {
        viewer.querySelector('.artwork-price').textContent = `$${artwork.price} ${artwork.currency || 'USD'}`;
        viewer.querySelector('.artwork-price').style.display = 'block';
    } else {
        viewer.querySelector('.artwork-price').style.display = 'none';
    }

    if (artwork.productUrl) {
        viewer.querySelector('.artwork-link').href = artwork.productUrl;
        viewer.querySelector('.artwork-link').style.display = 'inline-block';
    } else {
        viewer.querySelector('.artwork-link').style.display = 'none';
    }

    viewer.classList.add('active');
    document.exitPointerLock();
}

function closeArtworkViewer() {
    document.getElementById('artwork-viewer').classList.remove('active');
    state.selectedArtwork = null;
}

// ============================================================
// MINI MAP
// ============================================================

function drawMiniMap() {
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#1f2937';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = 4;
    const offsetX = canvas.width / 2;
    const offsetY = 30;

    Object.entries(CONFIG.rooms).forEach(([roomId, room]) => {
        const x = offsetX + (room.position.x - room.dimensions.width / 2) * scale;
        const z = offsetY + (room.position.z - room.dimensions.depth / 2) * scale / 2;
        const w = room.dimensions.width * scale;
        const h = room.dimensions.depth * scale / 2;

        ctx.fillStyle = roomId === state.currentRoom ? '#3b82f6' : '#374151';
        ctx.fillRect(x, z, w, h);

        ctx.strokeStyle = '#6b7280';
        ctx.strokeRect(x, z, w, h);

        ctx.fillStyle = '#4ade80';
        room.spots.forEach(spot => {
            if (state.placements.has(spot.id)) {
                const dotX = offsetX + (room.position.x + spot.position.x) * scale;
                const dotZ = offsetY + (room.position.z + spot.position.z) * scale / 2;
                ctx.beginPath();
                ctx.arc(dotX, dotZ, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    });

    const playerX = offsetX + camera.position.x * scale;
    const playerZ = offsetY + camera.position.z * scale / 2;

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(playerX, playerZ, 4, 0, Math.PI * 2);
    ctx.fill();

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playerX, playerZ);
    ctx.lineTo(playerX + dir.x * 10, playerZ + dir.z * 5);
    ctx.stroke();
}

// ============================================================
// LOADING UI
// ============================================================

function updateLoadingStatus(message) {
    const el = document.querySelector('#loading-screen .status');
    if (el) el.textContent = message;
}

function updateLoadingProgress(percent) {
    const el = document.querySelector('#loading-screen .progress-bar');
    if (el) el.style.width = `${percent}%`;
}

function hideLoadingScreen() {
    const el = document.getElementById('loading-screen');
    if (el) {
        el.classList.add('fade-out');
        setTimeout(() => { el.style.display = 'none'; }, 500);
    }
}

// ============================================================
// ANIMATION LOOP
// ============================================================

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    updateMovement(delta);
    checkDoorProximity();
    drawMiniMap();

    renderer.render(scene, camera);
}

// ============================================================
// INITIALIZATION
// ============================================================

async function init() {
    try {
        console.log('[Init] Starting gallery...');
        updateLoadingProgress(10);

        initScene();
        updateLoadingProgress(30);

        await loadArtworksFromCSV();
        updateLoadingProgress(50);

        renderAllArtworks();
        updateLoadingProgress(90);

        initControls();
        updateLoadingProgress(100);

        animate();

        setTimeout(hideLoadingScreen, 500);

        console.log('[Init] Gallery ready');
        console.log(`[Init] Rooms: ${Object.keys(CONFIG.rooms).length}`);
        console.log(`[Init] Total spots: ${spotMeshes.size}`);
        console.log(`[Init] Placed artworks: ${state.placements.size}`);

    } catch (error) {
        console.error('[Init] Failed:', error);
        updateLoadingStatus(`Error: ${error.message}`);
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
